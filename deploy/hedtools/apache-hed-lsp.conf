# The /hed-lsp/ route of hedtools.org: Apache in front of the hed-lsp daemon container.
#
# Install as /etc/apache2/snippets/hed-lsp.conf and include it from the hedtools.org :443 virtual host
# only, with one line there: Include /etc/apache2/snippets/hed-lsp.conf
# docs/deployment-hedtools.md has the steps, the checks, and the rollback.
#
# Before it is installed, replace <tester-1> and <tester-2> with the addresses of the testers (Stage 1).
# Until they are replaced, apachectl configtest fails, which keeps a copy that was never edited from
# going live. At Stage 2, change the Require line to: Require all granted
#
# Modules: proxy, proxy_http, headers, env, and authz_host with authz_core (Require ip). Apache's
# configtest does not notice a missing proxy_http; the first request would fail instead.
#
# Measured on Apache 2.4.52 in front of the daemon image, with the daemon's rate limits raised:
# - ProxyPass with disablereuse=On: Apache's HTML 502 in 6, 9, and 10 of 10 trials for 600000, 1000000, and
#   2000000 bytes; the 600000-byte body got the JSON 413 in the other 4 trials. The 502 comes from the
#   daemon closing the connection after its JSON 413 while Apache is still sending the body. Without
#   disablereuse=On (keep-alive to the backend) they got the daemon's JSON 413 in 10 of 10 trials each, so
#   the option is left out.
# - LimitRequestBody 1048576 did not stop a proxied body: one of 2000017 bytes reached the daemon, so the
#   line is left out and the daemon's limit of 524288 bytes is the only limit.
# - This snippet: 600000, 1000000, and 2000000 bytes each got the JSON 413 in 10 of 10 trials; a chunked
#   small body got 200; a burst of 30 small validates through one Apache all got 200; a 3000000-byte body
#   got Apache's HTML 502 in 10 of 10, as expected, because the daemon closes the connection after its
#   bounded discard of 2097152 bytes (4 times the limit).
# ttl=30 keeps Apache's idle backend connections below the daemon's keep-alive of 65 seconds, and there is
# at most one per prefork worker, 150 at most, under the daemon's cap of 256 connections.
# See "Oversize request bodies" in docs/deployment-hedtools.md.

<Location "/hed-lsp/">
    # Stage 1: testers only. Stage 2: change this line to "Require all granted".
    Require ip 127.0.0.1 <tester-1> <tester-2>
    ProxyPass        "http://127.0.0.1:38530/" timeout=40 connectiontimeout=3 retry=0 ttl=30
    ProxyPassReverse "http://127.0.0.1:38530/"
    SetEnv proxy-sendcl 1
    RequestHeader unset X-Forwarded-For
</Location>
